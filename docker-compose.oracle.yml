# Oracle Hash deployment (~/moneyprinterturbo on 129.146.84.6, compose project moneyprinterturbo).
# Only the WebUI runs; it calls the services in-process, so the API container isn't needed.
# No host ports: Coolify's Traefik routes to the alias below via a hand-written dynamic config
# (/data/coolify/proxy/dynamic/moneyprinterturbo.yml) that also adds basic auth, since the
# WebUI has no login of its own and holds the LLM / Pexels keys.
#
#   cp -n config.example.toml config.toml   # must exist as a file before the first `up`
#   docker compose -f docker-compose.oracle.yml up -d --build
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: default
        PIP_USE_OFFICIAL: "1"
    image: moneyprinterturbo:local
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.enableCORS=True", "--server.enableXsrfProtection=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    expose:
      - "8501"
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml
      - ./storage:/MoneyPrinterTurbo/storage
    # Rendering is CPU-bound; leave headroom for the WordPress stores and the Naureen engine.
    cpus: 1.5
    mem_limit: 4g
    restart: unless-stopped
    networks:
      default: {}
      coolify:
        aliases: [moneyprinterturbo]

networks:
  coolify:
    external: true
